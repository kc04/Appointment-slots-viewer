<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Choose Your Appointment Slot</title>
    <style>
        :root {
            --bg: #fff7ed;
            --bg-accent: #ffedd5;
            --card: #ffffff;
            --card-border: rgba(249, 115, 22, 0.2);
            --accent: #f97316;
            --accent-strong: #ea580c;
            --text: #1f2937;
            --muted: #6b7280;
            --success: #15803d;
            --danger: #b91c1c;
            font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(1000px 460px at 10% -20%, rgba(249, 115, 22, 0.28), transparent 55%),
                radial-gradient(820px 380px at 95% 0%, rgba(251, 191, 36, 0.18), transparent 60%),
                linear-gradient(180deg, var(--bg-accent), var(--bg));
            color: var(--text);
        }

        .page {
            max-width: 980px;
            margin: 0 auto;
            padding: 48px 20px 64px;
        }

        .top-banner {
            width: fit-content;
            margin: 0 auto 18px;
            padding: 7px 14px;
            border-radius: 999px;
            border: 1px solid rgba(249, 115, 22, 0.4);
            background: linear-gradient(135deg, #f97316, #fb923c 48%, #facc15);
            color: #ffffff;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.01em;
            box-shadow: 0 8px 20px rgba(249, 115, 22, 0.25);
        }

        header {
            text-align: center;
            margin-bottom: 36px;
        }

        header p {
            margin: 0 0 10px;
            color: var(--muted);
            font-size: 1rem;
        }

        header h1 {
            margin: 0;
            font-size: clamp(1.95rem, 5.2vw, 2.9rem);
            line-height: 1.1;
            letter-spacing: -0.02em;
            color: #111827;
        }

        .slots {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 18px;
        }

        .day-card {
            background: linear-gradient(180deg, #ffffff, #fffaf5);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .day-card h2 {
            margin: 0;
            font-size: 1.06rem;
            letter-spacing: 0.01em;
            color: #374151;
        }

        .slot-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .slot-button {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            border: 1px solid rgba(249, 115, 22, 0.34);
            border-radius: 12px;
            padding: 13px 14px;
            background: linear-gradient(180deg, rgba(249, 115, 22, 0.24), rgba(249, 115, 22, 0.18));
            color: #7c2d12;
            cursor: pointer;
            transition: transform 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
            font-size: 0.97rem;
            text-align: left;
        }

        .slot-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 16px rgba(234, 88, 12, 0.18);
            background: linear-gradient(180deg, rgba(249, 115, 22, 0.34), rgba(249, 115, 22, 0.25));
        }

        .slot-button:focus-visible {
            outline: 3px solid rgba(249, 115, 22, 0.33);
            outline-offset: 2px;
        }

        .slot-button span {
            font-weight: 700;
        }

        .slot-button small {
            color: #9a3412;
            font-weight: 600;
        }

        .status {
            margin-top: 24px;
            padding: 14px 16px;
            border-radius: 12px;
            text-align: center;
            display: none;
            border: 1px solid transparent;
        }

        .status.show {
            display: block;
        }

        .status.success {
            background: rgba(34, 197, 94, 0.12);
            color: var(--success);
            border-color: rgba(34, 197, 94, 0.3);
        }

        .status.error {
            background: rgba(239, 68, 68, 0.12);
            color: var(--danger);
            border-color: rgba(239, 68, 68, 0.3);
        }

        .empty-state {
            text-align: center;
            color: var(--muted);
            font-size: 1rem;
            padding: 26px 0;
        }

        @media (max-width: 600px) {
            .page {
                padding-top: 30px;
                padding-bottom: 42px;
            }

            .day-card {
                padding: 16px;
            }

            .slot-button {
                padding: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="top-banner">Hii good morning</div>
        <header>
            <p id="businessTagline">Select the time that works best for you</p>
            <h1 id="pageTitle">Available Appointment Slots</h1>
        </header>

        <div id="slotsContainer" class="slots"></div>
        <div id="status" class="status" role="status"></div>
    </div>

    <script>
        /**
         * This page expects a query param called "data" that contains a URI-encoded JSON string.
         * Example payload:
         * {
         *   "businessName": "myKaarma",
         *   "appointmentType": "Service",
         *   "webhookUrl": "https://example.com/webhook",
         *   "slots": {
         *     "2024-11-18": [
         *       { "id": "slot_2024-11-18_0900", "startTime": "9:00 AM", "endTime": "10:00 AM" }
         *     ]
         *   }
         * }
         */
        const defaultData = {
            businessName: "myKaarma",
            appointmentType: "appointment",
            webhookUrl: "",
            metadata: {
                MessageSid: "",
                From: "",
                To: "",
                Body: "",
                ButtonText: "",
                ButtonPayload: "",
                ProfileName: ""
            },
            slots: {
                "2024-11-18": [
                    { startTime: "9:00 AM", endTime: "10:00 AM" },
                    { startTime: "11:00 AM", endTime: "12:00 PM" }
                ],
                "2024-11-19": [
                    { startTime: "2:00 PM", endTime: "3:00 PM" }
                ]
            }
        };

        function parseAppointmentData() {
            const params = new URLSearchParams(window.location.search);
            const encoded = params.get("data");

            if (!encoded) return defaultData;

            try {
                return JSON.parse(decodeURIComponent(encoded));
            } catch (error) {
                console.warn("Unable to parse data parameter. Falling back to defaults.", error);
                return defaultData;
            }
        }

        function createSlotId(date, startTime, index) {
            const normalizedTime = (startTime || "")
                .toLowerCase()
                .replace(/[:\s]/g, "");
            return `slot_${date}_${normalizedTime}_${index}`;
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString(undefined, {
                weekday: "long",
                month: "long",
                day: "numeric"
            });
        }

        function showStatus(message, type = "success") {
            const statusEl = document.getElementById("status");
            statusEl.textContent = message;
            statusEl.className = `status show ${type}`;
        }

        function renderSlots(data) {
            const container = document.getElementById("slotsContainer");
            container.innerHTML = "";

            document.getElementById("pageTitle").textContent = "Service availability";
            document.getElementById("businessTagline").textContent = `Tap a slot to confirm your ${data.appointmentType}.`;

            const dates = Object.keys(data.slots || {});
            if (!dates.length) {
                container.innerHTML = `<div class="empty-state">No open slots were provided.</div>`;
                return;
            }

            dates.sort().forEach((date) => {
                const dayCard = document.createElement("section");
                dayCard.className = "day-card";
                dayCard.innerHTML = `<h2>${formatDate(date)}</h2>`;

                const list = document.createElement("div");
                list.className = "slot-list";

                (data.slots[date] || []).forEach((slot, index) => {
                    const slotId = slot.id || createSlotId(date, slot.startTime, index + 1);
                    const btn = document.createElement("button");
                    btn.type = "button";
                    btn.className = "slot-button";
                    btn.dataset.slotId = slotId;
                    btn.innerHTML = `
                        <span>${slot.startTime} – ${slot.endTime}</span>
                        <small>Tap to confirm</small>
                    `;
                    btn.addEventListener("click", () => bookSlot({
                        slotId,
                        date,
                        startTime: slot.startTime,
                        endTime: slot.endTime
                    }, data.webhookUrl, data.metadata));
                    list.appendChild(btn);
                });

                if (!list.children.length) {
                    list.innerHTML = `<div class="empty-state">No times for this day.</div>`;
                }

                dayCard.appendChild(list);
                container.appendChild(dayCard);
            });
        }

        async function bookSlot(slot, webhookUrl, metadata = {}) {
            if (!webhookUrl) {
                showStatus("No webhook URL provided. Please configure one.", "error");
                return;
            }

            const payload = {
                slotId: slot.slotId,
                date: slot.date || "",
                startTime: slot.startTime,
                endTime: slot.endTime,
                MessageSid: metadata?.MessageSid || "",
                From: metadata?.From || "",
                To: metadata?.To || "",
                Body: metadata?.Body || "",
                ButtonText: metadata?.ButtonText || "",
                ButtonPayload: metadata?.ButtonPayload || "",
                ProfileName: metadata?.ProfileName || ""
            };

            try {
                const response = await fetch(webhookUrl, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error(`Webhook responded with ${response.status}`);
                }

                showStatus("Thanks! Your slot request was submitted.", "success");
            } catch (error) {
                console.error("Failed to call webhook", error);
                showStatus("Sorry, we couldn't submit that slot. Please retry.", "error");
            }
        }

        const appointmentData = parseAppointmentData();
        renderSlots(appointmentData);
    </script>
</body>
</html>
